name: Pay and Connect Voucher Request

on:
  repository_dispatch:
    types: [run-voucher-request]
  workflow_dispatch:
  
jobs:
  request:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.1.7

    - name: Set up Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run Program
      run: npm start
      env:
        # Preferred: provide all student accounts in one secret named `STUDENTS` (JSON or CSV)
        STUDENTS: ${{ secrets.STUDENTS }}
        NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        NOTIFICATION_EMAIL_PASSWORD: ${{ secrets.NOTIFICATION_EMAIL_PASSWORD }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

                
            
